[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sycoattn"
version = "0.1.0"
description = "Evidence attention and sycophancy in multi-turn conversations (CS6120 Group 8)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
    "datasets>=3.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "pyyaml",
    "certifi",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
nnsight = ["nnsight"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
